# 配信先とテーマの設定（自由に編集してください）
#
# email:        配信先のGmailアドレス
# themes:       このアドレス宛に届けたい記事のテーマ（キーワード）。
#               記事のタイトルか概要にこのキーワードが1つでも含まれていれば配信対象になる。
#               空リスト([])にすると、テーマを問わず最新記事から配信される。
# max_articles: 1回の配信で届ける記事数の上限
recipients:
  - email: "hengshanharuki08@gmail.com"
    themes:
      - "金融"
      - "スタートアップ"
      - "就職"
      - "為替"
    max_articles: 5
