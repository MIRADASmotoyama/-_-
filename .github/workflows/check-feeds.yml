name: Check News Feeds

on:
  workflow_dispatch: {}

jobs:
  check-feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser PyYAML

      - name: Check feeds
        working-directory: news-digest/scripts
        run: python check_feeds.py
